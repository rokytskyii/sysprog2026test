name: Embedded CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi gcc make python3 libnewlib-arm-none-eabi

      - name: 1. Check Architecture Dependencies
        run: |
          python3 scripts/check_deps.py

      - name: 2. Run Host-based Unit Tests
        run: |
          gcc -Wall -Wextra -Og \
            -I firmware/Platform/Inc -I firmware/Devices/Inc -I firmware/App/Inc \
            tests/test_devices.c \
            firmware/Devices/Src/mpu6050.c \
            firmware/Devices/Src/bmp180.c \
            firmware/Devices/Src/w25q64.c \
            firmware/Devices/Src/servo.c \
            firmware/Devices/Src/ov7670.c \
            -lm -o tests/runner
          ./tests/runner

      - name: 3. Build STM32 Firmware Binary
        run: |
          make -C firmware all